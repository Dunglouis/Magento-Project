## Dev only (mounted by compose.dev.yaml). Google refuses redirect URIs on .test domains, so the
## OAuth client registers http://localhost/technest_google/oauth/callback and this sends the browser
## on to the dev store with code + state intact (the session cookie lives on technest.test).
server {
  listen 8000;
  server_name localhost;

  location = /technest_google/oauth/callback {
    return 302 https://technest.test$request_uri;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
